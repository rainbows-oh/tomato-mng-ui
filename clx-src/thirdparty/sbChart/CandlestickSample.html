<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SBChart Stock Chart</title>

    <link rel="stylesheet" href="./sbchart.css" />
    <script type="text/javascript" src="./sbchart.js"></script>
    <script type="text/javascript" src="./license.js"></script>
  </head>
  <style>
    .sbchart-range-marker-max {
      fill: red !important;
    }
    .sbchart-range-marker-max polygon {
      fill: red !important;
    }
    .sbchart-range-marker-min {
      fill: blue !important;
    }
    .sbchart-range-marker-min polygon {
      fill: blue !important;
    }
    .stock-grid-wrap {
      width: 1000px;
      height: 400px;
      margin-top: 20px;
      overflow: auto;
      border: 1px solid #cfd8dc;
      border-radius: 4px;
      background: #fafafa;
    }
    .stock-mini-grid {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: #fff;
    }
    .stock-mini-grid th,
    .stock-mini-grid td {
      border-bottom: 1px solid #e0e0e0;
      padding: 8px 10px;
      vertical-align: top;
    }
    .stock-mini-grid th {
      position: sticky;
      top: 0;
      background: #eceff1;
      font-weight: 600;
      text-align: center;
      z-index: 1;
    }
    .stock-mini-grid th:first-child,
    .stock-mini-grid td:first-child {
      text-align: left;
      width: 58%;
    }
    .stock-mini-grid th:nth-child(2),
    .stock-mini-grid td:nth-child(2) {
      text-align: center;
      white-space: nowrap;
      width: 22%;
      color: #37474f;
    }
    .stock-mini-grid th:nth-child(3),
    .stock-mini-grid td:nth-child(3) {
      text-align: center;
      width: 20%;
    }
    .stock-mini-grid tbody tr:hover {
      background: #f5f5f5;
    }
    .stock-mini-grid tbody tr.is-grid-focus {
      background: #e3f2fd;
      outline: 2px solid #1976d2;
      outline-offset: -2px;
    }
  </style>

        </thead>
        <tbody id="stockGridBody"></tbody>

    </div>

      /** 차트 paint 마커와 하단 그리드 연동 on/off */
      var usePaintMarkerGridSync = true;

      /** HTML 특수문자 이스케이프 (innerHTML 삽입용) */
      function escapeHtml(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }

      /** 저가에 paint 마커를 그리는 캔들 인덱스인지 (3칸마다 1개) */
      function isPaintMarkerCandleIndex(index) {
        return index % 3 === 0;
      }

      /** 캔들 개수 기준으로 paint 마커(그리드 행) 개수 계산 */
      function paintMarkerCountForRows(rowCount) {
        var c = 0;
        for (var i = 0; i < rowCount; i++) {
          if (isPaintMarkerCandleIndex(i)) c++;
        }
        return c;
      }

      /** 캔들 인덱스 → 그리드 행 인덱스 (마커가 없는 캔들이면 -1) */
      function candleIndexToGridRowIndex(candleIndex) {
        if (!isPaintMarkerCandleIndex(candleIndex)) return -1;
        return candleIndex / 3;
      }

      /** 마커 개수만큼 공시 그리드 tbody 렌더 (candlestickData·stockGridRows 매핑) */
      function fillStockMiniGrid() {
        var tbody = document.getElementById("stockGridBody");
        if (!tbody) return;
        var markerCount = paintMarkerCountForRows(candlestickData.length);
        var rowsHtml = [];
        for (var g = 0; g < markerCount; g++) {
          var candleIndex = g * 3;
          var r = stockGridRows[g] || { title: "—", time: "—", type: "—" };
          rowsHtml.push(
            '<tr tabindex="-1" data-candle-index="' +
              candleIndex +
              '"><td>' +
              escapeHtml(r.title) +
              "</td><td>" +
              escapeHtml(r.time) +
              "</td><td>" +
              escapeHtml(r.type) +
              "</td></tr>",
          );
        }
        tbody.innerHTML = rowsHtml.join("");
      }

      /** 그리드 행 포커스 스타일·키보드 포커스 제거 */
      function clearStockGridRowFocus() {
        var tbody = document.getElementById("stockGridBody");
        if (!tbody) return;
        tbody.querySelectorAll("tr.is-grid-focus").forEach(function (tr) {
          tr.classList.remove("is-grid-focus");
        });
        if (document.activeElement && tbody.contains(document.activeElement)) {
          document.activeElement.blur();
        }
      }

      /** 차트 enter + 마커 캔들일 때 해당 그리드 행으로 포커스·스크롤 */
      function focusStockGridRowForPaintMarkerEnter(parm) {
        if (!parm || parm.mouseEventType !== "enter" || !parm.data) return;
        var idx = parm.data.index;
        if (typeof idx !== "number" || !isPaintMarkerCandleIndex(idx)) return;
        var rowIdx = candleIndexToGridRowIndex(idx);
        var tbody = document.getElementById("stockGridBody");
        if (!tbody) return;
        var trs = tbody.querySelectorAll("tr");
        var tr = trs[rowIdx];
        if (!tr) return;
        clearStockGridRowFocus();
        tr.classList.add("is-grid-focus");
        tr.focus({ preventScroll: false });
        tr.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }

      /** 마커 조건을 만족하는 캔들만 저가에 path 마커 JSON 생성 (차트 paint용) */
      function buildLowPaintMarkers(rows) {
        var pathPx = [
          { x: -10, y: 15 },
          { x: 0, y: 0 },
          { x: 10, y: 15 },
          { x: 0, y: 12 },
        ];
        return rows
          .map(function (row, index) {
            if (!isPaintMarkerCandleIndex(index)) return null;
            return {
              type: "custom",
              position: [{ x: index + 0.5, y: row.lowprc }],
              subShape: [
                {
                  type: "path",
                  positionPx: pathPx,
                  color: "black",
                  fillColor: "black",
                },
              ],
            };
          })
          .filter(Boolean);
      }

      /** Y축 범위 계산 후 #chartWrap 에 캔들+거래량 SBChart 렌더 */
      function createStockChart() {
        const yMin = Math.floor(Math.min(...candlestickData.map((d) => d.lowprc)) * 0.97);
        const yMax = Math.ceil(Math.max(...candlestickData.map((d) => d.highprc)) * 1.03);
        const n = candlestickData.length;
        const tickValues = [];
        if (n > 0) {
          const step = Math.max(1, Math.floor((n - 1) / 6));
          for (let i = 0; i < n; i += step) tickValues.push(i);
          if (tickValues[tickValues.length - 1] !== n - 1) tickValues.push(n - 1);
        }

        sb.chart.render("#chartWrap", {
          global: {
            /** 차트 enter/out 시 (연동 켜진 경우) 하단 그리드 포커스 동기화 */
            onMouseEvent: function (parm) {
              if (!usePaintMarkerGridSync) return;
              if (parm.mouseEventType === "out") {
                clearStockGridRowFocus();
                return;
              }
              if (parm.mouseEventType === "enter") {
                focusStockGridRowForPaintMarkerEnter(parm);
              }
            },
            paint: {
              use: true,
              showControl: false,
              paintJsondata: {
                useBackground: true,
                jsonData: buildLowPaintMarkers(candlestickData),
              },
            },
            padding: {
              bottom: 80,
            },
            crosshair: {
              x: {
                /** 크로스헤어 X축 눈금에 표시할 날짜 문자열 */
                format: function (value) {
                  return candlestickData[Math.floor(value)].date;
                },
              },
              show: true,
              dotted: false,
              showValueX: true,
            },
          },
          grid: {
            x: {
              show: false,
            },
          },
          legend: {
            show: false,
          },
          data: {
            json: candlestickData,
            keys: {
              x: "date",
              value: [
                {
                  open: "openprc",
                  close: "closeprc",
                  low: "lowprc",
                  high: "highprc",
                },
              ],
            },
            types: {
              openprc: "candlestick",
              closeprc: "candlestick",
              lowprc: "candlestick",
              highprc: "candlestick",
              avgline: "candlestick",
            },
            datarange: {
              position: "auto",
              show: true,
              selectable: false,
              size: {
                height: 50,
              },
              backgroundChart: {
                bUseChart: true,
                chartType: "bar",
                seriesKey: "volume",
                strokeColor: "#4a7fd4",
                color: "#8eb4f0",
                barWidth: 10,
                syncCrosshair: true,
              },
              drBoundary: {
                strokeColor: "#6b9ae8",
                strokeWidth: 1,
                strokeOpacity: 0.45,
                color: "#8eb4f0",
                opacity: 0,
              },
            },
          },

          tooltip: {
            width: "200px",
            grouped: false,
            noUseExpand: true,
            noUseUnexpand: true,
            /** 툴팁 HTML: 거래량 막대 vs 캔들 OHLC 구분 */
            custom: function (data) {
              if (!data || !data[0]) {
                return "";
              }
              var idx = data[0].index;
              var row = candlestickData[idx];
              if (!row) return "";

              var border =
                row.updwn === "UP"
                  ? "3px solid #e53935"
                  : row.updwn === "DN"
                    ? "3px solid #1e88e5"
                    : "3px solid rgba(255,255,255,0.35)";

              if (data[0].id === "volume") {
                var vol = data[0].value != null && data[0].value !== "" ? data[0].value : row.volume;
                return (
                  '<div style="color: white;padding: 12px; line-height: 1.5; border: 3px solid rgba(255,255,255,0.35); border-radius: 6px;">' +
                  '<div style="font-weight: bold; margin-bottom: 8px;">[ ' +
                  row.date +
                  " ]</div>" +
                  '<div style="margin-bottom: 4px;">거래량 : ' +
                  Number(vol).toLocaleString() +
                  "</div>" +
                  "</div>"
                );
              }

              return (
                '<div style="color: white;padding: 12px; line-height: 1.5; border: ' +
                border +
                '; border-radius: 6px;">' +
                '<div style="font-weight: bold; margin-bottom: 8px;">[ ' +
                row.date +
                " ]</div>" +
                '<div style="margin-bottom: 4px;">고가 : ' +
                Number(data[0].high).toLocaleString() +
                "</div>" +
                '<div style="margin-bottom: 4px;">시가 : ' +
                Number(data[0].open).toLocaleString() +
                "</div>" +
                '<div style="margin-bottom: 4px;">종가 : ' +
                Number(data[0].close).toLocaleString() +
                "</div>" +
                '<div style="margin-bottom: 4px;">저가 : ' +
                Number(data[0].low).toLocaleString() +
                "</div>" +
                "</div>"
              );
            },
          },

          axis: {
            x: {
              type: "category",
              tick: {
                outer: false,
                centered: true,
                width: 100,
                autoSkipOverlap: true,
                line: {
                  show: false,
                },
              },
            },
            y: {
              tick: {
                outer: false,
                line: {
                  show: false,
                },
              },
              min: yMin,
              max: yMax,
            },
          },

          extend: {
            candlestick: {
              marker: {
                show: true,
              },
              auto: true,
            },
          },
        });
